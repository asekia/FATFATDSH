<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080506"/>
      <stop offset="55%" stop-color="#12090b"/>
      <stop offset="100%" stop-color="#1f0a0d"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d2d"/>
      <stop offset="55%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1214"/>
      <stop offset="100%" stop-color="#120a0c"/>
    </linearGradient>
    <linearGradient id="cardForged" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0f12"/>
      <stop offset="100%" stop-color="#180a0c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd5d0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff5252" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ───────── 左侧：标题组 ───────── -->
  <g>
    <text x="60" y="118" fill="url(#titleGrad)" font-size="56" font-weight="700" letter-spacing="0.5">dsh-wire-forge</text>
    <text x="60" y="152" fill="#ff8a80" font-size="18">wire-layer extension for DeepSeek Harness</text>
    <text x="60" y="188" fill="#9a8a86" font-size="13.5" letter-spacing="0.3">forged turns &#183; kernel-gated &#183; zero message mutation</text>
    <rect x="60" y="208" width="86" height="26" rx="13" fill="none" stroke="#ff8a80" stroke-opacity="0.55" stroke-width="1"/>
    <text x="103" y="226" fill="#ff9e90" font-size="12.5" text-anchor="middle" letter-spacing="0.6">MIT</text>
  </g>

  <!-- ───────── 右侧：消息流示意 ───────── -->
  <!-- 三张普通消息卡：user / assistant / user，同一基线 -->
  <g>
    <!-- user 卡 -->
    <g>
      <rect x="560" y="96" width="92" height="118" rx="10" fill="url(#cardA)" stroke="#3a2226" stroke-width="1.2"/>
      <text x="574" y="120" fill="#8a6f6c" font-size="10.5" letter-spacing="0.5">USER</text>
      <rect x="574" y="132" width="62" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="574" y="144" width="50" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="574" y="156" width="58" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="574" y="176" width="38" height="5" rx="2.5" fill="#4a3033" opacity="0.6"/>
    </g>

    <!-- forged 卡：发光、虚线描边、插入感 -->
    <g>
      <circle cx="712" cy="155" r="72" fill="url(#halo)"/>
      <rect x="672" y="76" width="92" height="118" rx="10" fill="url(#cardForged)" stroke="url(#hot)" stroke-width="1.8" stroke-dasharray="5 4"/>
      <text x="686" y="100" fill="#ff8a80" font-size="10.5" font-weight="600" letter-spacing="0.5">+FORGED</text>
      <rect x="686" y="112" width="62" height="5" rx="2.5" fill="#7a3838"/>
      <rect x="686" y="124" width="50" height="5" rx="2.5" fill="#7a3838"/>
      <rect x="686" y="136" width="58" height="5" rx="2.5" fill="#7a3838"/>
      <rect x="686" y="148" width="42" height="5" rx="2.5" fill="#7a3838"/>
      <text x="686" y="178" fill="#ffb300" font-size="9.5" fill-opacity="0.85">inserted by wire</text>
    </g>

    <!-- user 卡（最后一条） -->
    <g>
      <rect x="784" y="96" width="92" height="118" rx="10" fill="url(#cardA)" stroke="#3a2226" stroke-width="1.2"/>
      <text x="798" y="120" fill="#8a6f6c" font-size="10.5" letter-spacing="0.5">USER</text>
      <rect x="798" y="132" width="62" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="798" y="144" width="56" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="798" y="156" width="48" height="5" rx="2.5" fill="#4a3033"/>
      <rect x="798" y="176" width="34" height="5" rx="2.5" fill="#4a3033" opacity="0.6"/>
    </g>

    <!-- 箭头链：卡与卡之间、流向 wire → model -->
    <g stroke="#c8564a" stroke-width="1.6" fill="none" opacity="0.85">
      <line x1="652" y1="155" x2="668" y2="155"/>
      <path d="M 662 150 L 668 155 L 662 160" stroke-width="1.6"/>
      <line x1="764" y1="155" x2="780" y2="155"/>
      <path d="M 774 150 L 780 155 L 774 160" stroke-width="1.6"/>
    </g>
    <g stroke="url(#hot)" stroke-width="2" fill="none" filter="url(#glow)">
      <line x1="876" y1="155" x2="1000" y2="155"/>
      <path d="M 992 148 L 1002 155 L 992 162" stroke-width="2"/>
    </g>
    <circle cx="1012" cy="155" r="8" fill="#ffb300" filter="url(#glow)"/>
    <text x="1012" y="185" fill="#ffcdd2" font-size="11" fill-opacity="0.8" text-anchor="middle">model</text>

    <!-- 说明标注 -->
    <text x="718" y="242" fill="#a1887f" font-size="11.5" text-anchor="middle">splices a forged turn between your message and the model</text>
  </g>

  <!-- 底行定位 -->
  <text x="1140" y="296" text-anchor="end" fill="#7a6a66" font-size="11.5">request-path &#183; no edits to your own words</text>
</svg>
